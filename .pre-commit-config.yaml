repos:
  # Several generic fixes
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: mixed-line-ending

  # Lint and format the code with ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff
        name: ruff-isort
        args: [--select=I, --fix]
      - id: ruff-format

  # Format JavaScript and JSX files with Prettier
  # NB: pinned to the last stable v3 tag; v4 on this mirror is only an
  # alpha and the repo is archived upstream.
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [javascript, jsx]
