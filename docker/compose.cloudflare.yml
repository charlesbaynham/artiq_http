# Docker Compose override for Cloudflare DNS-01 TLS challenges
# Usage: docker compose -f docker/compose.yml -f docker/compose.cloudflare.yml up -d
#
# This configuration builds a custom Caddy image with the Cloudflare DNS module
# to enable automatic HTTPS certificates via DNS-01 challenges. Useful for:
#   - Wildcard certificates (*.example.com)
#   - Internal/network-restricted deployments
#   - Avoiding port 80/443 exposure for HTTP-01 challenges
#
# Required environment variables:
#   - DOMAIN: Your domain name (e.g., example.com)
#   - CF_API_TOKEN: Cloudflare API token with Zone:Read and DNS:Edit permissions
#
# To create a Cloudflare API token:
#   1. Go to https://dash.cloudflare.com/profile/api-tokens
#   2. Create token with "Edit zone DNS" template
#   3. Grant Zone:Read and DNS:Edit permissions for your domain

services:
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend-cloudflare
    environment:
      - API_URL=http://backend:8000
      - CF_API_TOKEN=${CF_API_TOKEN}
      - DOMAIN=${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    restart: unless-stopped
