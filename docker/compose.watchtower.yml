# Docker Compose override file for Watchtower auto-updates
# Usage: docker compose -f docker/compose.yml -f docker/compose.watchtower.yml up -d
#
# This configuration pulls images from GitHub Container Registry (GHCR) and uses
# Watchtower to automatically update containers when new images are pushed.
#
# Before using, authenticate with GHCR:
#   echo $GITHUB_TOKEN | docker login ghcr.io -u <github-username> --password-stdin

services:
  backend:
    build: !reset []
    image: ${BACKEND_IMAGE:-ghcr.io/charlesbaynham/artiq_http/backend:latest}
    labels:
      com.centurylinklabs.watchtower.scope: artiq_http

  frontend:
    build: !reset []
    image: ${FRONTEND_IMAGE:-ghcr.io/charlesbaynham/artiq_http/frontend:latest}
    labels:
      com.centurylinklabs.watchtower.scope: artiq_http

  mcp:
    build: !reset []
    image: ${MCP_IMAGE:-ghcr.io/charlesbaynham/artiq_http/mcp:latest}
    labels:
      com.centurylinklabs.watchtower.scope: artiq_http

  watchtower:
    image: nickfedor/watchtower
    restart: always
    environment:
      WATCHTOWER_SCOPE: artiq_http
      WATCHTOWER_POLL_INTERVAL: 300
      WATCHTOWER_CLEANUP: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
