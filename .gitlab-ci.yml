# Default image, if not specified
image: python:3.11

stages:
  - Static Analysis
  - Prepare
  - Test
  - Build
  - Compile Documentation
  - Build Documentation
  - Docker

# Poetry setup shared across jobs
.poetry-setup:
  before_script:
    # Store the CI_JOB_TOKEN so that jobs can access other repositories with the access rights of the triggering user
    - echo -e "machine ${CI_SERVER_HOST}\nlogin gitlab-ci-token\npassword ${CI_JOB_TOKEN}" > ~/.netrc
    # Set up git so that test commits don't fail
    - echo [user] > ~/.gitconfig
    - echo name = Gitlabs CI Testing >> ~/.gitconfig
    - echo email = test@example.com >> ~/.gitconfig
    # Install Poetry
    - pip install poetry poetry-dynamic-versioning
    - poetry --version
    # Configure Poetry to create venv in project directory for easier caching
    - poetry config virtualenvs.in-project true
    # Install dependencies
    - poetry install --with dev

cache:
  key: ${CI_JOB_NAME}
  paths:
    - .venv
    - .cache

### Linting ###

pre-commit:
  extends: .poetry-setup
  stage: Static Analysis
  variables:
    PRE_COMMIT_HOME: ${CI_PROJECT_DIR}/.cache/pre-commit
  script:
    - poetry run pre-commit run --all
  allow_failure: true
  needs: []

### Tests ###

# Build the test master image
build-test-master:
  stage: Prepare
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      docker build \
        --cache-from $CI_REGISTRY_IMAGE/test-master:latest \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        -t $CI_REGISTRY_IMAGE/test-master:$CI_COMMIT_REF_SLUG \
        -f test-artiq/Dockerfile \
        test-artiq/
    - docker push $CI_REGISTRY_IMAGE/test-master:$CI_COMMIT_REF_SLUG
  needs: []

pytest:
  extends: .poetry-setup
  stage: "Test"
  services:
    - name: $CI_REGISTRY_IMAGE/test-master:$CI_COMMIT_REF_SLUG
      alias: test-master
  variables:
    ARTIQ_HTTP_HOST: "test-master"
  before_script:
    - !reference [.poetry-setup, before_script]
    # Wait for ARTIQ master to be ready
    - |
      echo "Waiting for ARTIQ master to be ready..."
      for i in {1..30}; do
        if timeout 1 bash -c "cat < /dev/null > /dev/tcp/test-master/3251" 2>/dev/null; then
          echo "ARTIQ master is ready!"
          exit 0
        fi
        echo "Still waiting..."
        sleep 1
      done
      echo "ARTIQ master failed to start"
      exit 1
  script:
    - poetry run coverage run --omit "tests/*,*/_version.py" -m pytest --realserver --junitxml=report.xml
    - poetry run coverage report
  coverage: '/^TOTAL.+?(\d+\%)$/'
  needs: ["build-test-master"]
  artifacts:
    when: always
    reports:
      junit: report.xml

### Build ###

build-package:
  extends: .poetry-setup
  stage: Build
  needs: []
  script:
    - poetry build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

### Documentation ###

# Build the documentation
make_docs:
  extends: .poetry-setup
  stage: Compile Documentation
  needs: []
  before_script:
    - !reference [.poetry-setup, before_script]
    # Additional system dependencies for docs
    - apt-get update && apt-get install -y librsvg2-bin
  script:
    - poetry run sphinx-apidoc -o docs/autogen "artiq_http"
    - poetry run sphinx-build docs html_out -b html
    - poetry run sphinx-build docs latex -b latex
  artifacts:
    paths:
      - latex
      - html_out
    expire_in: 1 hour

