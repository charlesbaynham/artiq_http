# Default image, if not specified
image: python:3.11

stages:
  - Static Analysis
  - Prepare
  - Test
  - Build
  - Compile Documentation
  - Build Documentation
  - Docker

# UV setup shared across jobs
.uv-setup:
  variables:
    UV_CACHE_DIR: ${CI_PROJECT_DIR}/.cache/uv
  before_script:
    # Store the CI_JOB_TOKEN so that jobs can access other repositories with the access rights of the triggering user
    - echo -e "machine ${CI_SERVER_HOST}\nlogin gitlab-ci-token\npassword ${CI_JOB_TOKEN}" > ~/.netrc
    # Set up git so that test commits don't fail
    - echo [user] > ~/.gitconfig
    - echo name = Gitlabs CI Testing >> ~/.gitconfig
    - echo email = test@example.com >> ~/.gitconfig
    # Install UV
    - pip install uv
    - uv --version
    # Install dependencies (including dev)
    - uv sync --extra dev

# Cache .cache directory (includes UV package cache and pre-commit)
cache:
  key: ${CI_JOB_NAME}
  paths:
    - .cache/

### Linting ###

pre-commit:
  extends: .uv-setup
  stage: Static Analysis
  script:
    - uv run pre-commit run --all
  allow_failure: true
  needs: []

### Tests ###

# Build the test master image using Nix
build-test-master:
  stage: Prepare
  image: nixos/nix:latest
  services:
    - docker:dind
  variables:
    NIX_CONFIG: |
      experimental-features = nix-command flakes
      accept-flake-config = true
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  before_script:
    - nix-env -iA nixpkgs.docker
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - cd test-artiq
    - nix build .#docker --accept-flake-config
    - docker load < result
    - docker tag artiq-test-master:latest $CI_REGISTRY_IMAGE/test-master:$CI_COMMIT_REF_SLUG
    - docker push $CI_REGISTRY_IMAGE/test-master:$CI_COMMIT_REF_SLUG
  tags:
    - docker
  needs: []

pytest:
  extends: .uv-setup
  stage: "Test"
  services:
    - name: $CI_REGISTRY_IMAGE/test-master:$CI_COMMIT_REF_SLUG
      alias: test-master
  variables:
    ARTIQ_HTTP_HOST: "test-master"
  before_script:
    - !reference [.uv-setup, before_script]
    # Wait for ARTIQ master to be ready
    - |
      echo "Waiting for ARTIQ master to be ready..."
      for i in {1..30}; do
        if timeout 1 bash -c "cat < /dev/null > /dev/tcp/test-master/3251" 2>/dev/null; then
          echo "ARTIQ master is ready!"
          exit 0
        fi
        echo "Still waiting..."
        sleep 1
      done
      echo "ARTIQ master failed to start"
      exit 1
  script:
    - uv run coverage run --omit "tests/*,*/_version.py" -m pytest --realserver --junitxml=report.xml
    - uv run coverage report
  coverage: '/^TOTAL.+?(\d+\%)$/'
  needs: ["build-test-master"]
  artifacts:
    when: always
    reports:
      junit: report.xml

### Build ###

build-package:
  extends: .uv-setup
  stage: Build
  needs: []
  script:
    - uv build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

### Documentation ###

# Build the documentation
make_docs:
  extends: .uv-setup
  stage: Compile Documentation
  needs: []
  before_script:
    - !reference [.uv-setup, before_script]
    # Additional system dependencies for docs
    - apt-get update && apt-get install -y librsvg2-bin
  script:
    - uv run sphinx-apidoc -o docs/autogen "artiq_http"
    - uv run sphinx-build docs html_out -b html
    - uv run sphinx-build docs latex -b latex
  artifacts:
    paths:
      - latex
      - html_out
    expire_in: 1 hour

