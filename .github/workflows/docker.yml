name: Docker

on:
  push:
    branches: [master]
    tags: ['*']

permissions:
  contents: read
  packages: write

jobs:

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [backend, frontend, mcp]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Sanitize ref slug
        id: slug
        run: |
          echo "slug=$(echo '${{ github.ref_name }}' | sed 's/[^a-zA-Z0-9._-]/-/g')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.image }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ steps.slug.outputs.slug }}
            ${{ github.ref == 'refs/heads/master' && format('ghcr.io/{0}/{1}:latest', github.repository, matrix.image) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
